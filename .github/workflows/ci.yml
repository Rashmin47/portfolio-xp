name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run build
        run: npm run build
        env:
          SITE_URL: https://rashmin.com.np
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: ci-placeholder

      - name: Check SEO output
        run: npm run seo:check
        env:
          SITE_URL: https://rashmin.com.np
